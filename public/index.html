<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Sentry Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { font-size: 1.5rem; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; border-radius: 8px; padding: 15px; border: 1px solid #334155; }
        .card h2 { font-size: 1rem; margin: 0 0 10px 0; color: #94a3b8; word-break: break-all; }
        .stat { font-size: 0.875rem; margin: 5px 0; }
        .risk { color: #f87171; font-weight: bold; }
        .ok { color: #4ade80; }
    </style>
</head>
<body>
    <h1>Institutional Audit Visibility</h1>
    <div id="dashboard" class="grid"></div>

    <script>
        async function loadAudits() {
            const res = await fetch('/api/audits');
            const audits = await res.json();
            const container = document.getElementById('dashboard');
            container.innerHTML = audits.map(audit => `
                <div class="card">
                    <h2>${audit.project.split('/').pop()}</h2>
                    <div class="stat">Secrets: <span class="${audit.summary.potential_secrets > 0 ? 'risk' : 'ok'}">${audit.summary.potential_secrets}</span></div>
                    <div class="stat">Missing Envs: <span class="${audit.summary.missing_definitions > 0 ? 'risk' : 'ok'}">${audit.summary.missing_definitions}</span></div>
                    <div class="stat">Orphans: ${audit.summary.orphaned_variables}</div>
                    <div class="stat" style="font-size: 0.7rem; color: #64748b; margin-top: 10px;">${new Date(audit.timestamp).toLocaleString()}</div>
                </div>
            `).join('');
        }
        loadAudits();
        setInterval(loadAudits, 5000);
    </script>
</body>
</html>
