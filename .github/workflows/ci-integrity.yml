name: CI Integrity Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run integrity scan
        run: npx env-integrity-sentry . --report

      - name: Fail if secrets detected
        if: failure()
        run: echo "Integrity scan failed – secret(s) found. See above."
