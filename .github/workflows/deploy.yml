name: deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af52
        with:
          persist-credentials: false
      
      - name: Install Node.js
        uses: actions/setup-node@60edb5dd545a775178f525247a6a91c73a14e420
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Apex Check
        run: node bin.cjs --verify
        
      - name: Run Environment Audit (Enforcement)
        run: node bin.cjs . --verify
        
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af52
        with:
          persist-credentials: false
      - name: Deploy to Fly.io
        run: npx -y flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
