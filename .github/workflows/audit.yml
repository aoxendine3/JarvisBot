name: Environment Integrity Audit
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Integrity Audit
        run: node bin.cjs . --json > audit-report.json
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-audit-report
          path: audit-report.json
